# ytm-pulsar voice sentences
# Слова колонки сюда не входят: дальше, следующий, назад, стоп, пауза,
# продолжи, играй, громче, тише. Их Pulsar выполняет сам и до ассистента
# не доносит.
language: "ru"
intents:
  YtmPulsarPlay:
    data:
      - sentences:
          - "включи ютуб"
          - "запусти ютуб"
          - "включи музыку на ютубе"
          - "музыка на ютубе"
  YtmPulsarNext:
    data:
      - sentences:
          - "ютуб вперёд"
          - "ютуб вперед"
          - "вперёд на ютубе"
          - "вперед на ютубе"
          - "другой трек на ютубе"
          - "переключи трек на ютубе"
  YtmPulsarPrevious:
    data:
      - sentences:
          - "ютуб обратно"
          - "обратно на ютубе"
          - "прошлый трек на ютубе"
          - "верни трек на ютубе"
  YtmPulsarSearch:
    data:
      - sentences:
          - "найди на ютубе {ytm_query}"
          - "поищи на ютубе {ytm_query}"
          - "поставь на ютубе {ytm_query}"
          - "включи на ютубе {ytm_query}"
  YtmPulsarClear:
    data:
      - sentences:
          - "ютуб удали все"
          - "ютуб удали всё"
          - "ютуб удалить все"
          - "ютуб удалить всё"
  YtmPulsarRandom:
    data:
      - sentences:
          - "случайное на ютубе"
          - "случайные песни на ютубе"
          - "рандом на ютубе"
          - "включи случайное на ютубе"
lists:
  ytm_query:
    wildcard: true
