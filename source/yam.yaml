name: local/ytm-alice
version: 0.7.6
license: MIT AND CC-BY-4.0
description: YouTube Music на колонке через медиаплеер Pulsar
targets: [plum]
permissions: [network, audio, exec]
files:
  bin/ytm-alice: dist/ytm-alice
  bin/ytm-alice-resolver: dist/ytm-alice-resolver
  share/local.ytm-alice/README.md: ../README.md
  share/local.ytm-alice/remote-cli.py: remote-cli.py
  share/local.ytm-alice/THIRD_PARTY_NOTICES.md: ../docs/THIRD_PARTY_NOTICES.md
  share/local.ytm-alice/LICENSE: ../licenses/LICENSE
  share/local.ytm-alice/licenses/: ../licenses/
  share/local.ytm-alice/RELEASE.md: ../docs/RELEASE.md
  share/local.ytm-alice/SETTINGS.md: ../docs/SETTINGS.md
  share/local.ytm-alice/WEBUI.md: ../docs/WEBUI.md
services:
  player:
    exec: [bin/ytm-alice, serve]
    restart: on-failure
